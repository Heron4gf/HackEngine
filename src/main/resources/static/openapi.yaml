openapi: 3.0.3
info:
  title: HackHub API
  description: API REST per la gestione di hackathon, team, utenti e inviti
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Server di sviluppo

paths:
  # ==================== UTENTI ====================
  /api/users:
    get:
      summary: Restituisce tutti gli utenti
      tags: [Utenti]
      responses:
        '200':
          description: Lista di utenti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'

    post:
      summary: Crea un nuovo utente
      tags: [Utenti]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Utente creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Richiesta non valida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{id}:
    get:
      summary: Restituisce un utente specifico
      tags: [Utenti]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Utente trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Utente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== HACKATHON ====================
  /api/hackathons:
    get:
      summary: Restituisce tutti gli hackathon
      tags: [Hackathon]
      responses:
        '200':
          description: Lista di hackathon
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HackathonResponse'

    post:
      summary: Crea un nuovo hackathon
      tags: [Hackathon]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHackathonRequest'
      responses:
        '201':
          description: Hackathon creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HackathonResponse'
        '400':
          description: Dati non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/hackathons/{id}:
    get:
      summary: Restituisce un hackathon specifico
      tags: [Hackathon]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Hackathon trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HackathonResponse'
        '404':
          description: Hackathon non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/hackathons/joinable:
    get:
      summary: Restituisce gli hackathon a cui è possibile iscriversi
      tags: [Hackathon]
      responses:
        '200':
          description: Lista di hackathon joinable
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HackathonResponse'

  /api/hackathons/{id}/chiudi-sottomissioni:
    post:
      summary: Chiude le sottomissioni per un hackathon
      tags: [Hackathon]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sottomissioni chiuse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Hackathon non in corso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/hackathons/{id}/avanza-stato:
    post:
      summary: Avanza lo stato di un hackathon
      tags: [Hackathon]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stato avanzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # ==================== TEAM ====================
  /api/teams:
    get:
      summary: Restituisce tutti i team
      tags: [Team]
      responses:
        '200':
          description: Lista di team
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamResponse'

    post:
      summary: Crea un nuovo team
      tags: [Team]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400':
          description: Richiesta non valida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/teams/{nome}:
    get:
      summary: Restituisce un team specifico
      tags: [Team]
      parameters:
        - name: nome
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Team trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '404':
          description: Team non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/teams/{nome}/esci:
    post:
      summary: Permette a un utente di uscire da un team
      tags: [Team]
      parameters:
        - name: nome
          in: path
          required: true
          schema:
            type: string
        - name: utenteId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Uscito dal team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/teams/{nome}/iscrizione:
    post:
      summary: Iscrive un team a un hackathon
      tags: [Team]
      parameters:
        - name: nome
          in: path
          required: true
          schema:
            type: string
        - name: hackathonId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: utenteId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Team iscritto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Errore nell'iscrizione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== INVITI ====================
  /api/invites:
    post:
      summary: Invia un invito a un utente
      tags: [Inviti]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
      responses:
        '200':
          description: Invito inviato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/invites/casella/{utenteId}:
    get:
      summary: Restituisce la casella degli inviti di un utente
      tags: [Inviti]
      parameters:
        - name: utenteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista di inviti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invito'

  /api/invites/accetta:
    post:
      summary: Accetta un invito
      tags: [Inviti]
      parameters:
        - name: nomeTeam
          in: query
          required: true
          schema:
            type: string
        - name: utenteId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invito accettato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Invito non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/invites/rifiuta:
    post:
      summary: Rifiuta un invito
      tags: [Inviti]
      parameters:
        - name: nomeTeam
          in: query
          required: true
          schema:
            type: string
        - name: utenteId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invito rifiutato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

components:
  schemas:
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        cognome:
          type: string
          nullable: true
        role:
          type: string

    CreateUserRequest:
      type: object
      required:
        - role
        - nome
      properties:
        role:
          type: string
          enum: [UTENTE, ORGANIZZATORE, GIUDICE, MENTORE]
        nome:
          type: string
          minLength: 3
          maxLength: 30
        cognome:
          type: string
          minLength: 3
          maxLength: 30

    HackathonResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        luogo:
          type: string
        premioInDenaro:
          type: number
        currency:
          type: string
        dimensioneMaxTeam:
          type: integer
        regolamento:
          type: string
        stato:
          type: string
          enum: [ISCRIZIONE, IN_CORSO, VALUTAZIONE, CONCLUSO]
        organizzatoreId:
          type: string
          format: uuid
        giudiceId:
          type: string
          format: uuid

    CreateHackathonRequest:
      type: object
      required:
        - organizzatoreId
        - nome
        - luogo
        - premioInDenaro
        - currency
        - dimensioneMaxTeam
        - regolamento
        - iscrizioni
        - durata
        - giudiceId
      properties:
        organizzatoreId:
          type: string
          format: uuid
        nome:
          type: string
        luogo:
          type: string
        premioInDenaro:
          type: number
        currency:
          type: string
        dimensioneMaxTeam:
          type: integer
          minimum: 1
          maximum: 20
        regolamento:
          type: string
        iscrizioni:
          $ref: '#/components/schemas/IntervalloRequest'
        durata:
          $ref: '#/components/schemas/IntervalloRequest'
        giudiceId:
          type: string
          format: uuid

    IntervalloRequest:
      type: object
      required:
        - dataInizio
        - dataFine
      properties:
        dataInizio:
          type: string
          format: date-time
        dataFine:
          type: string
          format: date-time

    TeamResponse:
      type: object
      properties:
        nome:
          type: string
        maxMembri:
          type: integer
        membri:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'

    CreateTeamRequest:
      type: object
      required:
        - utenteId
        - nome
        - maxMembri
      properties:
        utenteId:
          type: string
          format: uuid
        nome:
          type: string
          minLength: 2
          maxLength: 50
        maxMembri:
          type: integer
          minimum: 1
          maximum: 20

    InviteUserRequest:
      type: object
      required:
        - teamMittenteNome
        - destinatarioId
      properties:
        teamMittenteNome:
          type: string
        destinatarioId:
          type: string
          format: uuid

    Invito:
      type: object
      properties:
        mittente:
          $ref: '#/components/schemas/TeamResponse'
        destinatario:
          $ref: '#/components/schemas/UserResponse'

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
